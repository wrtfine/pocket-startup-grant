<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>스타트업 지원사업 매칭 보드</title>
  <script src="./crm-bridge-extension/crm-core.js"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
  <style>
    @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css");
    * { box-sizing: border-box; }
    body { margin: 0; }
    .grant-app {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      background: #f5f7f8;
      color: #172026;

    }
    .left-panel {
      width: 288px;
      min-width: 288px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #dfe5e8;
      background: #ffffff;
    }
    .panel-head {
      padding: 18px;

      gap: 10px;
      align-items: center;
      justify-content: space-between;
    }
    .title { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: 0; }

    }
    .title.add-trigger:hover {

    }

    .icon-btn, .text-btn {
      border: 1px solid #cfd8dc;

      color: #172026;
      border-radius: 8px;
      height: 34px;
      padding: 0 11px;
      cursor: pointer;
      font-weight: 400;
    }
    .primary { background: #2563eb; border-color: #2563eb; color: #fff; }
    .overdue-toggle {
      height: 28px;
      padding: 0 9px;
      font-size: 11px;
      border-radius: 7px;
    }
    .danger { color: #b42318; border-color: #f0b8b2; }
    .search {
      margin: 0 18px 12px;
      height: 38px;
      border: 1px solid #d7e0e4;
      border-radius: 8px;
      padding: 0 12px;
      outline: none;
      font-size: 14px;
    }
    .grant-list { overflow: auto; padding: 4px 18px 20px; flex: 1; }
    .grant-category {
      margin-bottom: 14px;
    }
    .grant-category-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 7px 2px 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid #dfe5e8;
      color: #59676f;
      font-size: 12px;
      font-weight: 400;
    }
    .grant-category-count {
      color: #6b7880;
      font-size: 12px;
      font-weight: 400;
    }
    .grant-tab {
      width: 100%;
      border: 1px solid #dfe7ea;
      background: #ffffff;
      display: flex;
      gap: 5px;
      align-items: flex-start;
      justify-content: space-between;
      padding: 9px 8px 9px 12px;
      height: 64px;
      border-radius: 8px;
      cursor: grab;
      color: inherit;
      text-align: left;
      touch-action: none;
      margin-bottom: 8px;
      box-shadow: 0 3px 10px rgba(15, 23, 42, 0.07);
    }
    .grant-entry { margin-bottom: 8px; }
    .grant-entry .grant-tab { margin-bottom: 0; }
    .grant-entry .grant-tab.has-allocations {
      background: var(--allocation-bg);
      border-color: var(--allocation-border);
    }
    .grant-entry .grant-tab.has-allocations:hover,
    .grant-entry .grant-tab.has-allocations.selected {
      background: var(--allocation-bg);
      border-color: #9db7ff;
    }
    .grant-tab.has-allocations.highlight { box-shadow: inset 0 0 0 2px #2563eb; }
    .grant-actions { display: flex; align-items: center; gap: 3px; }
    .grant-actions .grant-copy-tab { min-width: 29px; padding: 0 3px; }
    .grant-roll-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      width: 26px;
      height: 18px;
      padding: 0;
      border: 1px solid #cfd8dc;
      border-radius: 5px;
      background: #ffffff;
      color: #4b5563;
      font: inherit;
      font-size: 10px;
      cursor: pointer;
    }
    .grant-roll-toggle:hover,
    .grant-roll-toggle[aria-expanded="true"] { border-color: #94a3b8; background: #f8fafc; }
    .grant-roll-toggle:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }
    .grant-roll {
      margin-top: 3px;
      padding: 5px 9px;
      border: 1px solid var(--allocation-border, #e3e8eb);
      border-radius: 6px;
      background: #ffffff;
      max-height: 180px;
      overflow-y: auto;
    }
    .grant-roll-name {
      padding: 4px 0;
      color: #171717;
      font-size: 12px;
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .grant-roll-name.recommendation { color: #b4bbc2; }
    .grant-roll-empty { padding: 4px 0; color: #8a979e; font-size: 12px; }
    .grant-link-chip {
      height: 21px;
      border-radius: 999px;
      border: 1px solid #bfdbfe;
      background: #eff6ff;
      color: #1d4ed8;
      padding: 0 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 11px;
      font-weight: 500;
      line-height: 1;
    }
    .grant-side {
      flex: 0 0 58px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      margin-right: 0;
    }
    .grant-copy-tab {
      border: 1px solid #cfd8dc;
      background: #ffffff;
      color: #4b5563;
      border-radius: 5px;
      min-width: 34px;
      height: 18px;
      padding: 0 5px;
      font-size: 10px;
      line-height: 16px;
      font-weight: 500;
      cursor: pointer;
    }
    .grant-copy-tab:hover {
      border-color: #2563eb;
      color: #2563eb;
      background: #f8fbff;
    }
    .grant-tab:hover, .grant-tab.selected {
      background: #f6f9ff;
      border-color: #9db7ff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.12);
    }
    .grant-tab.highlight {
      background: #e8f0ff;
      box-shadow: inset 0 0 0 2px #2563eb;
    }
    .grant-name {
      flex: 0 1 auto;
      max-width: calc(100% - 63px);
      font-size: 14px;
      line-height: 1.3;
      font-weight: 500;
      word-break: keep-all;
      white-space: pre-line;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .grant-title-link {
      color: inherit;
      text-decoration: none;
      cursor: pointer;
    }
    .grant-title-link:hover {
      color: #2563eb;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .dday {
      flex: 0 0 auto;
      min-width: 44px;
      text-align: center;
      padding: 2px 0;
      font-size: 12px;
      font-weight: 500;
    }
    .dday.urgent { color: #dc2626; }
    .dday.past { color: #374151; }
    .dday.normal { color: #172026; }
    .right-panel {
      flex: 1;
      min-width: 520px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #f9fbfb;
    }
    .board-head {
      min-height: 68px;
      flex: 0 0 auto;
      padding: 12px 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px 14px;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #dfe5e8;
      background: #f9fbfb;
    }
    .board-title-wrap {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .board-title-wrap > .title { white-space: nowrap; }
    .board-head > .board-actions { margin-left: auto; }
    .criteria-chips {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .criteria-chip {
      border: 1px solid #d7e0e4;
      background: #eef2f3;
      color: #39474f;
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      line-height: 1.25;
      box-shadow: 0 3px 8px rgba(15, 23, 42, 0.08);
    }
    .criteria-chip span {
      display: block;
      color: #172026;
      font-weight: 400;
      margin-bottom: 2px;
    }
    .criteria-date {
      color: #59676f;
      font-weight: 300;
      font-style: normal;
    }
    .board-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .board-tabs {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .board-tab {
      height: 30px;
      border: 1px solid #d7e0e4;
      background: #ffffff;
      color: #39474f;
      border-radius: 7px;
      padding: 0 14px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }
    .board-tab.active {
      background: #172026;
      border-color: #172026;
      color: #ffffff;
      box-shadow: 0 5px 14px rgba(15, 23, 42, 0.16);
    }
    .board-tab.log-tab,
    .board-tab.log-tab.active {
      border-color: transparent;
      background: transparent;
      border-radius: 0;
      padding: 0 4px;
      color: #39474f;
    }
    .board-tab.log-tab.active {
      color: #2563eb;
      font-weight: 500;
    }
    .toggle-label {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #59676f;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      user-select: none;
    }
    .company-row {
      flex: 1 1 auto;
      overflow: auto;
      display: flex;
      flex-direction: column;
      padding: 8px 12px 7px;
      gap: 7px;
      background: #f9fbfb;
    }
    .company-line {
      display: flex;
      align-items: stretch;
      gap: 9px;
      min-height: 296px;
      flex: 0 0 296px;
    }
    .company-column {
      width: 226px;
      min-width: 226px;
      max-width: 238px;
      height: 100%;
      min-height: 296px;
      background: #ffffff;
      border: 1px solid #dfe5e8;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .company-column.pocket-company {
      background: #f6f7f8;
      border-color: #e1e6e9;
      opacity: 0.82;
    }
    .company-column.pocket-company .company-top {
      background: linear-gradient(180deg, #f2f4f5 0%, #f8f9fa 76%, #ffffff 100%);
    }
    .company-column.pocket-company .assignment-list {
      background: linear-gradient(180deg, #ffffff 0%, #f7f8f9 42px, #f7f8f9 100%);
    }
    .company-column.drag-target {
      border-color: #7da0ff;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.12);
    }
    .company-insert-marker {

      z-index: 56;

      background: #60a5fa;
      box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.18);
      pointer-events: none;
    }
    .company-top {
      padding: 10px 14px 12px;
      cursor: grab;
      background: linear-gradient(180deg, #eff6ff 0%, #f8fbff 72%, #ffffff 100%);
      position: relative;
      touch-action: none;
    }
    .company-controls {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      gap: 5px;
    }
    .crm-chip {
      height: 24px;
      border: 1px solid #bfdbfe;
      background: #ffffff;
      color: #1d4ed8;
      border-radius: 7px;
      padding: 0 8px;
      display: flex;
      align-items: center;
      text-decoration: none;
      font-size: 12px;
      font-weight: 500;
    }
    .ended-pill {
      display: flex;
      align-items: center;
      height: 24px;
      border-radius: 999px;
      padding: 0 8px;
      background: #eef2f3;
      color: #667780;
      font-size: 12px;
      font-weight: 500;
    }
    .company-name {
      margin: 0 0 6px;
      font-size: 16px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .company-name-row {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 6px;
      padding-right: 44px;
    }
    .company-name-row .company-name {
      margin-bottom: 0;
      flex: 1;
      min-width: 0;
    }
    .pin-mark {
      color: #dc2626;
      font-size: 12px;
      line-height: 1;
      font-weight: 600;
      flex: 0 0 auto;
    }
    .badges {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .badge {
      border-radius: 999px;
      background: #eef2f3;
      color: #39474f;
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 400;
    }
    .round-row, .contract-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 4px;
    }
    .stepper { display: flex; align-items: center; gap: 8px; }
    .round-btn {
      width: 18px;
      height: 22px;
      border: 0;
      background: transparent;
      color: #172026;
      cursor: pointer;
      font-size: 15px;
      font-weight: 400;
      line-height: 1;
      padding: 0;
    }
    .round-value {
      font-size: 13px;
      font-weight: 500;
    }
    .round-value.pocket {
      color: #172026;
    }
    .company-page-switch {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
      margin-top: 0;
    }
    .dots { display: flex; align-items: center; gap: 4px; margin-left: auto; }
    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1px solid #9fb0b7;
      background: #fff;
      cursor: pointer;
    }
    .dot.request,
    .dot.confirmed { background: #ffffff; border-color: #172026; }
    .dot.progress,
    .dot.preparing,
    .dot.ceo { background: #172026; border-color: #172026; }
    .dot.ready,
    .dot.material_done,
    .dot.meeting { background: #2563eb; border-color: #2563eb; }
    .dot.done,
    .dot.delivered,
    .dot.completed { background: #1e3a8a; border-color: #1e3a8a; }
    .dot.passed,
    .dot.paper_pass,
    .dot.final_pass { background: #ec4899; border-color: #ec4899; }
    .assignment-list {
      flex: 1;
      overflow: hidden;
      padding: 4px 7px 3px;
      background: linear-gradient(180deg, #ffffff 0%, #fbfcfc 42px, #fbfcfc 100%);
    }
    .assignment-list.has-visible-assignments {
      overflow: auto;
    }
    .page-btn {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 1px solid #d7e0e4;
      background: #ffffff;
      color: #172026;
      cursor: pointer;
      font-size: 11px;
      line-height: 1;
      padding: 0;
    }
    .page-btn:disabled {
      opacity: 0.35;
      cursor: default;
    }
    .assigned-tab {
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      gap: 4px;
      width: 100%;
      max-width: 100%;
      padding: 6px 7px;
      border-radius: 8px;
      background: #ffffff;
      border: 1px solid #dfe7ea;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.05);
      margin-bottom: 7px;
    }
    .assigned-tab:last-of-type {
      margin-bottom: 0;
    }
    .assigned-tab:hover {
      border-color: #b7c8ff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.1);
    }

      z-index: 60;
    }
    .assigned-tab.soft-blue {

    .assigned-tab.soft-blue:hover {
      border-color: #c6dcff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.09);
    }
    .assigned-main {
      min-width: 0;
      flex: 1 1 auto;
      max-width: calc(100% - 16px);
    }
    .assigned-title {
      font-size: 13.5px;
      font-weight: 500;
      line-height: 1.35;
      margin-top: 4px;
      margin-bottom: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }
    .assigned-title.inline {
      margin-top: 0;
      max-width: 100%;
    }
    .assigned-tab .dday {
      font-size: 12.5px;
    }
    .assigned-tab.compact-done {
      padding: 4px 6px;
      background: #fafbfb;
      border-color: #e3e8eb;
      box-shadow: none;
      color: #66727a;

      border-color: #d8e0e4;

    }

      border-radius: 6px;
      padding: 0 6px;
      font-size: 11px;
    }
    .assigned-tab.compact-done .remove,
    .assigned-tab.compact-done .assignment-note-btn {
      color: #8b969d;
      opacity: 0.78;
    }
    .assigned-tab.compact-done .assignment-note-btn.active {
      color: #657179;
      opacity: 1;
    }
    .assigned-tab.has-allocations:not(.compact-done) {
      background: var(--allocation-tint);
      border-color: var(--allocation-border);

    .assigned-tab.has-allocations.soft-blue {
      background: var(--allocation-bg);
    }
    .assigned-tab.material-done,

    .assignment-topline {

      justify-content: flex-start;
      gap: 5px;
      min-height: 22px;
    }

      gap: 4px;
      flex: 0 0 auto;
      flex-wrap: wrap;
      justify-content: flex-end;
      position: relative;
    }
    .status-btn {
      height: 24px;
      border: 1px solid #cfd8dc;
      background: #ffffff;
      color: #59676f;
      border-radius: 7px;
      padding: 0 7px;
      min-width: 38px;
      cursor: pointer;

    .status-btn.completed.active {

      gap: 3px;

    }
    .status-menu-btn {

      border: 1px solid transparent;

      background: #ffffff;

      font-weight: 400;
      text-align: left;
      padding: 0 7px;

    .status-menu-btn:hover {

    }
    .status-menu-btn.selected {
      border-color: #cfd8dc;
      background: #f8fbff;
    }

      position: absolute;

                            const grant = grantMap[item.grantId];
                            if (!company) return null;
                            if (item.type === "meeting") {
                              const meetingKind = normalizeScheduleKind(item.kind) || "meeting";
                              return (
                                <div className={`schedule-item schedule-meeting ${meetingKind === "ir" || meetingKind === "work" ? "schedule-ir" : ""}`} key={item.id} title={item.externalSource ? "CRM 연동 일정" : "드래그하면 일정 이동"} onPointerDown={(e) => startScheduleMove(e, item)} onClick={(e) => e.stopPropagation()}>
                                  {item.time && <span className="meeting-time">{item.time}</span>}
                                  {meetingKind !== "work" && <span className="meeting-kind">{scheduleKindLabel(meetingKind)}</span>}
                                  <span className="meeting-title">{meetingKind === "work" ? `${company.name} · ${item.title || "작업"}` : company.name}</span>
                                </div>
                              );
                            }
                            if (!grant) return null;
                            return (
                              <div className="schedule-item schedule-grant slim-schedule" key={item.id} title="드래그하면 일정 이동" onPointerDown={(e) => startScheduleMove(e, item)} onClick={(e) => e.stopPropagation()}>
                                <div className="schedule-grant-line">
                                  <span className="schedule-company">{company.name}</span>
                                  <span className="schedule-title">{grant.title}</span>
                                </div>
                              </div>
                            );
                          })}
                        </div>
                        <div className="deadline-list">
                          {deadlineGrants.map((grant) => (
                            <div className={`schedule-item schedule-deadline ${isReadyDeadlineGrant(grant.id) ? "ready-deadline" : ""}`} key={`deadline-${grant.id}`} title="클릭하면 지원사업 정보" onClick={() => setViewingGrant(grant)}>
                              <span className="deadline-label">마감</span>
                              <span className="deadline-title">{grant.title}</span>
                            </div>
                          ))}
                        </div>
                      </div>
                    );
                  })}
                </div>
                <div className="modal-actions">
                  <div className="action-right"><button className="text-btn primary" onClick={() => setShowFullCalendar(false)}>닫기</button></div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }
    function GrantDetailModal({ grant, onClose, onEdit, onSelect, onDelete }) {
      return (
        <div className="modal-backdrop">
          <div className="modal">
            <h2>지원사업 정보</h2>
            <div className="detail-list">
              <div className="detail-item"><span className="detail-label">사업명</span><div className="detail-value">{grant.title || "-"}</div></div>
              <div className="detail-item"><span className="detail-label">마감일</span><div className="detail-value">{grant.deadline || "-"} {grant.deadline ? `(${ddayLabel(grant.deadline)})` : ""}</div></div>
              <div className="detail-item"><span className="detail-label">제출 서류</span><div className="detail-value">{[...(grant.documentTypes || []), (grant.documentTypes || []).includes("그 외") ? grant.documentOther : ""].filter(Boolean).join(", ") || "-"}</div></div>
              <div className="detail-item"><span className="detail-label">지원 규모</span><div className="detail-value">{grant.budget || "-"}</div></div>
              <div className="detail-item"><span className="detail-label">지원 지역</span><div className="detail-value">{grant.region || "-"}</div></div>
              <div className="detail-item"><span className="detail-label">지원 대상 조건</span><div className="detail-value">{grant.condition || "-"}</div></div>
              <div className="detail-item"><span className="detail-label">메모</span><div className="detail-value" dangerouslySetInnerHTML={{ __html: grant.memo || "-" }} /></div>
              <div className="detail-item"><span className="detail-label">공고 링크</span><div className="detail-value">{grant.link || "-"}</div></div>
            </div>
            <div className="modal-actions">
              <div className="action-right">
                <button className="text-btn danger" onClick={onDelete}>삭제</button>
                <button className="text-btn" onClick={onEdit}>수정</button>
                <button className="text-btn primary" onClick={onClose}>닫기</button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function GrantModal({ grant, onClose, onSave, onDelete }) {
      const initialDocuments = Array.isArray(grant.documentTypes) ? grant.documentTypes : [];
      const [form, setForm] = useState({ title: "", deadline: "", budget: "", region: "", condition: "", link: "", category: "", memo: "", documentOther: "", ...grant, documentTypes: initialDocuments });
      const toggleDocumentType = (type) => {
        const current = Array.isArray(form.documentTypes) ? form.documentTypes : [];
        setForm({ ...form, documentTypes: current.includes(type) ? current.filter((item) => item !== type) : [...current, type] });
      };
      const preparedForm = () => ({
        ...form,
        documentOther: (form.documentTypes || []).includes("그 외") ? form.documentOther || "" : ""
      });
      const autoSaveAndClose = () => {
        if (form.title.trim()) onSave(preparedForm());
        else onClose();
      };
      return (
        <div className="modal-backdrop" onPointerDown={(event) => { if (event.target === event.currentTarget) autoSaveAndClose(); }}>
          <div className="modal grant-edit-modal" onPointerDown={(event) => event.stopPropagation()}>
            <div className="modal-title-row">
              <h2>{form.id ? "지원사업 정보" : "지원사업 추가"}</h2>
              <div className="modal-title-actions">
                {onDelete && <button className="text-btn danger" onClick={() => onDelete(form.id)}>삭제</button>}
                <button className="text-btn primary" disabled={!form.title.trim()} onClick={() => onSave(preparedForm())}>저장</button>
              </div>
            </div>
            <div className="form-grid">
              <Field label="사업명"><input value={form.title} onChange={(e) => setForm({ ...form, title: e.target.value })} /></Field>
              <Field label="지원 구분"><select value={form.category || ""} onChange={(e) => setForm({ ...form, category: e.target.value })}><option value="">자동 분류</option>{grantCategories.map((category) => <option key={category} value={category}>{category}</option>)}</select></Field>
              <Field label="제출 서류">
                <div className="check-row">
                  {["IR", "사업계획서", "그 외"].map((type) => (
                    <button type="button" className={`check-pill ${(form.documentTypes || []).includes(type) ? "selected" : ""}`} key={type} onClick={() => toggleDocumentType(type)}>
                      {type}
                    </button>
                  ))}
                </div>
                {(form.documentTypes || []).includes("그 외") && <input value={form.documentOther || ""} onChange={(e) => setForm({ ...form, documentOther: e.target.value })} placeholder="필요한 서류를 입력하세요" style={{ marginTop: "8px" }} />}
              </Field>
              <Field label="마감일"><input type="date" value={form.deadline} onChange={(e) => setForm({ ...form, deadline: e.target.value })} /></Field>
              <Field label="지원 규모"><textarea value={form.budget} onChange={(e) => setForm({ ...form, budget: e.target.value })} /></Field>
              <Field label="지원 지역"><input value={form.region} onChange={(e) => setForm({ ...form, region: e.target.value })} /></Field>
              <Field label="지원 대상 조건"><textarea value={form.condition} onChange={(e) => setForm({ ...form, condition: e.target.value })} /></Field>
              <Field label="메모"><RichMemoEditor value={form.memo || ""} onChange={(value) => setForm({ ...form, memo: value })} /></Field>
              <Field label="공고 링크"><input value={form.link} onChange={(e) => setForm({ ...form, link: e.target.value })} /></Field>
            </div>
            <div className="modal-actions">
              <div className="action-right"><button className="text-btn" onClick={onClose}>취소</button></div>
            </div>
          </div>
        </div>
      );
    }
    function RichMemoEditor({ value, onChange }) {
      const editorRef = useRef(null);
      useEffect(() => {
        const editor = editorRef.current;
        if (editor && document.activeElement !== editor && editor.innerHTML !== value) editor.innerHTML = value || "";
      }, [value]);
      const applyBold = () => {
        editorRef.current?.focus();
        if (document.execCommand) document.execCommand("bold", false, null);
        onChange(editorRef.current?.innerHTML || "");
      };
      return (
        <div>
          <div className="memo-toolbar">
            <button className="memo-bold-btn" type="button" title="굵게 Ctrl+B" onMouseDown={(event) => { event.preventDefault(); applyBold(); }}>B</button>
          </div>
          <div
            className="rich-memo"
            ref={editorRef}
            contentEditable={true}
            suppressContentEditableWarning={true}
            onInput={(event) => onChange(event.currentTarget.innerHTML)}
            onKeyDown={(event) => {
              if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "b") {
                event.preventDefault();
                applyBold();
              }
            }}
          ></div>
        </div>
      );
    }
    function CompanyModal({ company, onClose, onSave, onDelete }) {
      const [form, setForm] = useState({ name: "", memo: "", region: "", foundedDate: "", crmUrl: "", round: 1, monthlyTarget: 3, monthlyDone: 0, assignedGrantIds: [], assignmentStatuses: {}, contractEnded: false, ...company });
      return (
        <div className="modal-backdrop">
          <div className="modal">
            <h2>{form.id ? "기업 수정" : "기업 추가"}</h2>
            <div className="form-grid">
              <Field label="기업명"><input value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} /></Field>
              <Field label="메모"><textarea value={form.memo} onChange={(e) => setForm({ ...form, memo: e.target.value })} /></Field>
              <Field label="창업지역"><input value={form.region} onChange={(e) => setForm({ ...form, region: e.target.value })} /></Field>
              <Field label="창립일자"><input type="date" value={form.foundedDate || ""} onChange={(e) => setForm({ ...form, foundedDate: e.target.value })} /></Field>
              <Field label="업력 자동 판정"><input value={companyAgeLabel(form.foundedDate)} readOnly /></Field>
              <Field label="CRM URL"><input value={form.crmUrl || ""} onChange={(e) => setForm({ ...form, crmUrl: e.target.value })} placeholder="https://..." /></Field>
              <Field label="현재 회차"><input type="number" min="0" value={form.round} onChange={(e) => setForm({ ...form, round: e.target.value })} /></Field>
              <Field label="월 계약 건수"><input type="number" min="1" value={form.monthlyTarget} onChange={(e) => setForm({ ...form, monthlyTarget: e.target.value })} /></Field>
              <label className="toggle-label"><input type="checkbox" checked={!!form.contractEnded} onChange={(e) => setForm({ ...form, contractEnded: e.target.checked })} />계약 종료</label>
            </div>
            <div className="modal-actions">
              {onDelete && <button className="text-btn danger" onClick={() => onDelete(form.id)}>삭제</button>}
              <div className="action-right"><button className="text-btn" onClick={onClose}>취소</button><button className="text-btn primary" disabled={!form.name.trim()} onClick={() => onSave(form)}>저장</button></div>
            </div>
          </div>
        </div>
      );
    }
    function Field({ label, children }) {
      return <div className="field"><label>{label}</label>{children}</div>;
    }
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, message: "" };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, message: error?.message || String(error || "알 수 없는 오류") };
      }
      componentDidCatch(error) {
        console.error("Page render failed", error);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="customer-page">
              <div className="customer-shell">
                <div className="customer-empty">페이지 오류: {this.state.message}</div>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }
    function App() {
      const companyId = requestedCompanyId();
      return companyId ? <CustomerGrantPage companyId={companyId} /> : <StartupGrantBoard />;
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><App /></ErrorBoundary>);
  </script>
</body>
</html>
